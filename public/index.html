<!DOCTYPE html>
<html dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shisheiha</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.1/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="login-box">
    <div class="login-header">
      <i class="ti ti-message-circle-2" style="font-size:48px; color:#4facfe;"></i>
      <h1>Shisheiha</h1>
      <p>Welcome to the glass world</p>
    </div>
    <div id="loginError" class="error-msg" style="display:none;"></div>
    <input type="text" id="username" placeholder="@username (letters, numbers, _, .)" autocomplete="username">
    <input type="password" id="password" placeholder="Password (min 4 chars)" autocomplete="current-password">
    <button id="loginBtn">Sign In</button>
    <button id="registerBtn" class="secondary-btn">Create Account</button>
  </div>
</div>

<!-- ===== LOADING ===== -->
<div id="loading" style="display:none;">
  <div class="loading-box">
    <i class="ti ti-glass" style="font-size:64px; color:#4facfe; animation: spin 2s linear infinite;"></i>
    <h2>Polishing your glass...</h2>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="slogan">
      💎 Our motto always:<br>
      <strong>«مصرف بی‌رویه کار خیلی بدیه»</strong>
    </p>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app" style="display:none;">
  <!-- Left Sidebar -->
  <div id="sidebar">
    <div id="profile">
      <img id="avatarImg" src="" alt="avatar">
      <div class="profile-info">
        <span id="displayName"></span>
        <div id="levelBadge">Level 1</div>
      </div>
      <div class="profile-actions">
        <input type="file" id="avatarUpload" accept="image/*" style="display:none;">
        <button onclick="document.getElementById('avatarUpload').click()" class="icon-btn" title="Change avatar">
          <i class="ti ti-camera"></i>
        </button>
        <button id="logoutBtn" class="icon-btn" title="Logout">
          <i class="ti ti-logout"></i>
        </button>
      </div>
    </div>

    <div class="search-box">
      <i class="ti ti-search"></i>
      <input type="text" id="searchUser" placeholder="Search users...">
      <div id="searchResults" style="display:none;"></div>
    </div>

    <div class="chat-list">
      <div class="section-header">
        <i class="ti ti-messages"></i>
        <span>Chats</span>
      </div>
      <div id="userList"></div>
      
      <div class="section-header" style="margin-top:16px;">
        <i class="ti ti-users"></i>
        <span>Groups</span>
      </div>
      <div id="groupList"></div>
      
      <div class="action-buttons">
        <button id="createGroupBtn" class="action-btn">
          <i class="ti ti-plus"></i> New Group
        </button>
        <button id="joinGroupBtn" class="action-btn secondary">
          <i class="ti ti-link"></i> Join Group
        </button>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div id="chatArea">
    <div id="chatHeader">
      <div>
        <span id="chatTitle">Select a chat</span>
        <span id="chatSubtitle"></span>
      </div>
      <div id="chatActions">
        <button id="groupInfoBtn" style="display:none;" class="icon-btn">
          <i class="ti ti-info-circle"></i>
        </button>
      </div>
    </div>
    <div id="messages"></div>
    <div id="inputArea">
      <button id="emojiBtn" class="icon-btn">
        <i class="ti ti-mood-happy"></i>
      </button>
      <input type="text" id="msgInput" placeholder="Type a message...">
      <button id="fileBtn" class="icon-btn">
        <i class="ti ti-photo"></i>
      </button>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">
      <button id="sendBtn">
        <i class="ti ti-send"></i>
      </button>
    </div>
  </div>
</div>

<!-- ===== GLASS NOTIFICATION ===== -->
<div id="glassNotification" style="display:none;">
  <i id="notifIcon" class="ti ti-info-circle"></i>
  <span id="notifText"></span>
</div>

<!-- ===== MODALS ===== -->
<div id="groupModal" style="display:none;" class="modal">
  <div class="modal-content">
    <h3><i class="ti ti-users"></i> New Group</h3>
    <input type="text" id="groupNameInput" placeholder="Group name">
    <div class="modal-actions">
      <button id="confirmCreateGroup" class="primary">Create</button>
      <button onclick="closeModal('groupModal')" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<div id="joinGroupModal" style="display:none;" class="modal">
  <div class="modal-content">
    <h3><i class="ti ti-link"></i> Join Group</h3>
    <input type="text" id="groupLinkInput" placeholder="Shisheiha://xxxxxxxxxx">
    <div class="modal-actions">
      <button id="confirmJoinGroup" class="primary">Join</button>
      <button onclick="closeModal('joinGroupModal')" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
