<!DOCTYPE html>
<html dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shisheiha</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f1a2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234facfe'/%3E%3Ctext x='50' y='72' font-family='Arial' font-size='68' font-weight='bold' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" type="image/svg+xml">
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="login-box">
    <div class="login-header">
      <i class="fas fa-comment-dots" style="font-size:48px; color:#4facfe;"></i>
      <h1>Shisheiha</h1>
      <p>Welcome to the glass world</p>
    </div>
    <div id="loginError" class="error-msg" style="display:none;"></div>
    <input type="text" id="username" placeholder="@username (letters, numbers, _, .)" autocomplete="username">
    <input type="password" id="password" placeholder="Password (min 4 chars)" autocomplete="current-password">
    <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
    <button id="registerBtn" class="secondary-btn"><i class="fas fa-user-plus"></i> Create Account</button>
  </div>
</div>

<!-- ===== LOADING ===== -->
<div id="loading" style="display:none;">
  <div class="loading-box">
    <i class="fas fa-wine-glass" style="font-size:64px; color:#4facfe; animation: spin 2s linear infinite;"></i>
    <h2>Polishing your glass...</h2>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="slogan">
      <i class="fas fa-gem"></i> Our motto always:<br>
      <strong>«مصرف بی‌رویه کار خیلی بدیه»</strong>
    </p>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app" style="display:none;">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="profile">
      <img id="avatarImg" src="" alt="avatar" onclick="openProfile(currentUser)">
      <div class="profile-info" onclick="openProfile(currentUser)">
        <span id="displayName"></span>
        <div id="levelBadge"><i class="fas fa-star"></i> Level 1</div>
      </div>
      <div class="profile-actions">
        <input type="file" id="avatarUpload" accept="image/*" style="display:none;">
        <button onclick="document.getElementById('avatarUpload').click()" class="icon-btn" title="Change avatar">
          <i class="fas fa-camera"></i>
        </button>
        <button id="logoutBtn" class="icon-btn" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>

    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchUser" placeholder="Search users...">
      <div id="searchResults" style="display:none;"></div>
    </div>

    <div class="chat-list">
      <div class="section-header"><i class="fas fa-comments"></i> Chats</div>
      <div id="userList"></div>
      
      <div class="section-header" style="margin-top:16px;"><i class="fas fa-users"></i> Groups</div>
      <div id="groupList"></div>
      
      <div class="action-buttons">
        <button id="createGroupBtn" class="action-btn"><i class="fas fa-plus"></i> New Group</button>
        <button id="joinGroupBtn" class="action-btn secondary"><i class="fas fa-link"></i> Join Group</button>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div id="chatArea">
    <div id="chatHeader">
      <div>
        <span id="chatTitle">Select a chat</span>
        <span id="chatSubtitle"></span>
      </div>
      <div id="chatActions">
        <button id="groupInfoBtn" style="display:none;" class="icon-btn">
          <i class="fas fa-info-circle"></i>
        </button>
      </div>
    </div>
    
    <!-- Reply Bar -->
    <div id="replyBar" style="display:none;">
      <div class="reply-content">
        <i class="fas fa-reply"></i>
        <div>
          <span id="replySender"></span>
          <span id="replyText"></span>
        </div>
        <button id="cancelReplyBtn"><i class="fas fa-times"></i></button>
      </div>
    </div>
    
    <!-- Call Actions -->
    <div id="callActions" style="display:none; padding: 8px 20px; background: rgba(79,172,254,0.08); border-bottom: 1px solid rgba(79,172,254,0.1); gap: 8px; align-items: center;">
      <button id="startCallBtn" class="action-btn" style="display:none;">
        <i class="fas fa-phone"></i> Start Call
      </button>
      <button id="joinCallBtn" class="action-btn secondary" style="display:none;">
        <i class="fas fa-phone"></i> Join Call
      </button>
      <button id="endCallBtn" class="action-btn danger" style="display:none; background: #ff6b6b; color: #fff;">
        <i class="fas fa-phone-slash"></i> End Call
      </button>
    </div>
    
    <div id="messages"></div>
    
    <div id="inputArea">
      <button id="fileBtn" class="icon-btn"><i class="fas fa-image"></i></button>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">
      <input type="text" id="msgInput" placeholder="Type a message...">
      <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- ===== CALL CONTAINER (Agora) ===== -->
<div id="callContainer" style="display:none; position:fixed; inset:0; z-index:10000; background:#0a1520; flex-direction:column;">
  <div id="remoteVideoContainer" style="flex:1; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px; padding:10px; background:#0a1520;"></div>
  <div id="localVideoContainer" style="width:180px; height:120px; position:absolute; bottom:100px; right:20px; border:2px solid rgba(79,172,254,0.3); border-radius:12px; overflow:hidden; background:#1a2a3a;"></div>
  <div id="callControls" style="position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; gap:20px; z-index:10001;">
    <button id="muteBtn" class="call-control-btn" style="background:rgba(255,255,255,0.1); border:none; border-radius:50%; width:50px; height:50px; color:#fff; font-size:20px; cursor:pointer;"><i class="fas fa-microphone"></i></button>
    <button id="videoBtn" class="call-control-btn" style="background:rgba(255,255,255,0.1); border:none; border-radius:50%; width:50px; height:50px; color:#fff; font-size:20px; cursor:pointer;"><i class="fas fa-video"></i></button>
    <button id="endCallBtnAgora" class="call-control-btn" style="background:#ff6b6b; border:none; border-radius:50%; width:50px; height:50px; color:#fff; font-size:20px; cursor:pointer;"><i class="fas fa-phone-slash"></i></button>
  </div>
</div>

<!-- ===== MODALS ===== -->
<!-- Profile Modal -->
<div id="profileModal" style="display:none;" class="modal">
  <div class="modal-content profile-card">
    <div class="profile-card-header">
      <img id="profileAvatar" src="" alt="avatar">
      <h3 id="profileUsername"></h3>
      <p id="profileDisplayName"></p>
      <p id="profileBio"></p>
      <p id="profileLevel"><i class="fas fa-star"></i> Level <span></span></p>
      <button class="close-btn" onclick="closeModal('profileModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="profile-card-actions">
      <button id="editProfileBtn" style="display:none;" class="primary"><i class="fas fa-edit"></i> Edit Profile</button>
    </div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div id="editProfileModal" style="display:none;" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-user-edit"></i> Edit Profile</h3>
    <input type="text" id="editDisplayName" placeholder="Display name">
    <textarea id="editBio" placeholder="Bio" rows="3"></textarea>
    <div class="modal-actions">
      <button id="saveProfileBtn" class="primary"><i class="fas fa-save"></i> Save</button>
      <button onclick="closeModal('editProfileModal')" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<!-- Forward Modal -->
<div id="forwardModal" style="display:none;" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-share"></i> Forward Message</h3>
    <p style="color:rgba(255,255,255,0.5); font-size:0.85rem; margin-bottom:12px;">Forward to a user or group</p>
    <input type="text" id="forwardSearch" placeholder="Search user or group...">
    <div id="forwardResults" style="max-height:200px; overflow-y:auto; margin:8px 0;"></div>
    <div class="modal-actions">
      <button onclick="closeModal('forwardModal')" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<!-- Group Modal -->
<div id="groupModal" style="display:none;" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-users"></i> New Group</h3>
    <input type="text" id="groupNameInput" placeholder="Group name">
    <div class="modal-actions">
      <button id="confirmCreateGroup" class="primary"><i class="fas fa-check"></i> Create</button>
      <button onclick="closeModal('groupModal')" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<!-- Join Group Modal -->
<div id="joinGroupModal" style="display:none;" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-link"></i> Join Group</h3>
    <input type="text" id="groupLinkInput" placeholder="Shisheiha://xxxxxxxxxx">
    <div class="modal-actions">
      <button id="confirmJoinGroup" class="primary"><i class="fas fa-check"></i> Join</button>
      <button onclick="closeModal('joinGroupModal')" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<!-- Notification -->
<div id="glassNotification" style="display:none;">
  <i id="notifIcon" class="fas fa-info-circle"></i>
  <span id="notifText"></span>
</div>

<!-- Scripts -->
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.23.0.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
